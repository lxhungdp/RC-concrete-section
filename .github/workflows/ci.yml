name: CI

on:
  push:
    branches: [main]
  pull_request:

# A result-relevant change must not merge on a green typecheck alone: the verification fixtures in
# `npm test` are the regression oracles (docs/09), so they run on every pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Deployment accepts compatible Node.js 24.x/npm 11.x patch releases. CI deliberately keeps
      # one exact reference pair so numerical and generated-artifact evidence remains reproducible.
      - name: Verify reference runtime
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "11.19.0"

      # `npm ci` fails on a lockfile that does not match package.json — dependency pinning is only
      # real if it is enforced (docs/08 §9).
      - name: Install
        run: npm ci

      - name: Production dependency audit
        run: npm run check:security

      - name: Typecheck
        run: npm run typecheck

      - name: Repository structure
        run: npm run check:structure

      - name: Unit tests
        run: npm run test:unit

      - name: CAD drawing tests
        run: npm run test:cad

      - name: Project round trip
        run: npm run test:roundtrip

      - name: Excel export verification
        run: npm run test:excel-export

      - name: Equivalent-block Excel verification
        run: npm run test:excel-block

      - name: Demand-check workbook and PDF-model agreement
        run: npm run test:demand-check

      - name: PDF report verification
        run: npm run test:pdf-report

      - name: Complex-section fixture is current
        run: |
          npm run fixture:complex-section-json
          git diff --exit-code -- "docs/examples/realistic-sections/KDS-REAL-05-complex-stress-strain.pm-project.json"

      # Cross-platform gate over 8 sections x 24 capacity quantities. Geometry, topology, sampled
      # strain states, warnings and flags remain bit-identical. Only declared resultants may consume
      # the reviewed section-scale IEEE-754 roundoff envelope; same-environment development runs use
      # the exact `npm run bench:verify` gate.
      - name: Capacity fingerprint is portable
        run: npm run bench:verify:portable

      - name: P16 external comparison remains within declared tolerances
        run: npm run verify:p16

      - name: Stress-strain sampling verification matrix
        run: npm run bench:strain-sampling

      - name: Equivalent-block verification matrix
        run: npm run bench:equivalent-block

      - name: Cross-model pipeline comparison
        run: npm run bench:pipelines

      - name: Build
        run: npm run build

      - name: Web bundle budgets
        run: npm run check:web-bundle
